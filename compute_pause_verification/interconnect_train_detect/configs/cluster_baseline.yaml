# Cluster baseline for 2×8-GPU (edit iface / master_addr before launch).
run_name: cluster_baseline
mode: cluster
collector:
  host: 0.0.0.0
  port: 8765
  poll_hz: 20
monitor:
  backends: [ib, nvml, proc_net]
  # e.g. mlx5_0 or ibp... — leave null to auto-pick first IB device
  ib_device: null
  iface: null
workloads:
  - name: train_ddp
    kind: train_ddp
    steps: 100
    warmup_steps: 10
    batch_size: 1
    seq_len: 512
    # launch externally via torchrun; orchestrator only tags windows
  - name: infer_dp
    kind: infer_dp
    steps: 100
    batch_size: 4
    seq_len: 512
  - name: infer_tp
    kind: infer_tp
    steps: 100
    batch_size: 1
    seq_len: 512
    tp_size: 2
model:
  backend: hf  # hf | tiny
  name_or_path: meta-llama/Llama-3.2-1B  # swap to 7B when VRAM allows
  dtype: bf16
detect:
  bandwidth_threshold_gbps: 5.0  # calibrate after first train window
  min_window_s: 5.0
output_dir: outputs/cluster_baseline
