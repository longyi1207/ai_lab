# Round 14: white-box combined adversary (src/workloads/white_box_disguise.py,
# new) -- combines everything learned so far instead of testing one
# variable at a time: SGD/momentum=0 (the one partial win), realistic
# batch/seq (round 8's values, not the OOD-risking extremes from rounds
# 10-11), no communication-shape changes (chunking/sparsity became a
# learned positive tell, rounds 1-9), PLUS a new axis nothing has touched
# yet -- deliberate idle gaps between steps, targeting the temporal/
# duty-cycle features (cv_power, periodicity_power) that pure per-step
# disguises never addressed.
#
# Run (GPUs 3-5), resuming from the round-12/13 continuation:
#   python -m src.run_redteam_loop \
#     --baseline-out outputs/azure_redteam_single_node \
#     --config configs/azure_redteam_hardening_loop_continue4.yaml \
#     --out outputs/azure_redteam_loop_continued4 \
#     --resume-from outputs/azure_redteam_loop_continued3
run_name: azure_redteam_hardening_loop_continue4
mode: redteam
collector:
  host: 127.0.0.1
  port: 8768
telemetry:
  synthetic: false
  hz: 1.0
benign_workloads:
  - {name: train_ddp, kind: train_ddp}
  - {name: infer_dp, kind: infer_dp}
  - {name: infer_tp, kind: infer_tp}
hardening_rounds:
  # idle_frac=1.0 -> roughly 50% duty cycle (sleeps ~as long as compute took)
  - {name: white_box_14, kind: white_box_disguise, steps: 800, batch_size: 4, seq_len: 512, idle_frac: 1.0, nproc: 3}
model:
  backend: tiny
  n_layer: 12
  n_head: 12
  n_embd: 768
  vocab_size: 32000
  block_size: 512
output_dir: outputs/azure_redteam_loop_continued4
