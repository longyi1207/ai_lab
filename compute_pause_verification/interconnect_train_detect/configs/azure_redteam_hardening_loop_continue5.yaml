# Round 15: gradient checkpointing (src/workloads/grad_checkpoint_disguise.py,
# new) -- the more realistic continuation of the memory axis flagged after
# round 14's confound (idle gaps dragged mean power out of distribution).
# Real large-model training routinely uses activation checkpointing to fit
# bigger batches/models in memory: recompute each transformer block's
# activations during backward instead of storing them, trading ~30-40%
# more compute for less activation memory -- AT REALISTIC batch/seq
# (4/512, same as round 8), not the OOD-risking extremes from rounds 10-11.
# Combined with the SGD/momentum=0 fix (round 8's partial win) and no
# communication-shape changes (backfired repeatedly, rounds 1-9).
#
# Run (GPUs 3-5), resuming from round 14 (the main adversarial chain --
# independent of the separate false-positive-fix branch):
#   python -m src.run_redteam_loop \
#     --baseline-out outputs/azure_redteam_single_node \
#     --config configs/azure_redteam_hardening_loop_continue5.yaml \
#     --out outputs/azure_redteam_loop_continued5 \
#     --resume-from outputs/azure_redteam_loop_continued4
run_name: azure_redteam_hardening_loop_continue5
mode: redteam
collector:
  host: 127.0.0.1
  port: 8768
telemetry:
  synthetic: false
  hz: 1.0
benign_workloads:
  - {name: train_ddp, kind: train_ddp}
  - {name: infer_dp, kind: infer_dp}
  - {name: infer_tp, kind: infer_tp}
hardening_rounds:
  - {name: grad_checkpoint_15, kind: grad_checkpoint_disguise, steps: 1500, batch_size: 4, seq_len: 512, nproc: 3}
model:
  backend: tiny
  n_layer: 12
  n_head: 12
  n_embd: 768
  vocab_size: 32000
  block_size: 512
output_dir: outputs/azure_redteam_loop_continued5
