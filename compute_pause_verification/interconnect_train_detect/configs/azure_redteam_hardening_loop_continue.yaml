# Continuation of configs/azure_redteam_hardening_loop.yaml's completed
# 8-round loop (outputs/azure_redteam_loop) — see docs/REDTEAM.md "First
# hardening round" / "Full 8-round hardening loop". Lists ONLY the new
# rounds; run with --resume-from so rounds 0-7 are reconstructed from
# their already-saved traces (no GPU time) rather than re-run.
#
# The real question this tests: every prior round reshaped COMMUNICATION
# only (chunk size, sync frequency, or both) — the classifier generalized
# to all of them from one example because none of them touch memory
# allocation (see docs/REDTEAM.md's mechanistic explanation:
# first_30s_mem_delta_mb, driven by AdamW's optimizer state, is what
# actually generalizes). low_mem_disguise removes that memory footprint at
# the source (plain SGD, momentum=0, no persistent optimizer state) — does
# hardening on 8 communication-only rounds transfer to an evasion that
# touches the actual feature being relied on, or does THIS one get through?
#
# Run (GPUs 3-5):
#   python -m src.run_redteam_loop \
#     --baseline-out outputs/azure_redteam_single_node \
#     --config configs/azure_redteam_hardening_loop_continue.yaml \
#     --out outputs/azure_redteam_loop_continued \
#     --resume-from outputs/azure_redteam_loop
run_name: azure_redteam_hardening_loop_continue
mode: redteam
collector:
  host: 127.0.0.1
  port: 8768
telemetry:
  synthetic: false
  hz: 1.0
benign_workloads:
  - {name: train_ddp, kind: train_ddp}
  - {name: infer_dp, kind: infer_dp}
  - {name: infer_tp, kind: infer_tp}
hardening_rounds:
  # round 8: memory-only evasion, isolated — plain SGD (no optimizer
  # state), but the ORIGINAL unchunked full-tensor AllReduce, so this
  # changes exactly one variable relative to everything folded in so far
  - {name: low_mem_8, kind: low_mem_disguise, steps: 2000, batch_size: 4, seq_len: 512, chunk_grad_sync: false, nproc: 3}
  # round 9: memory AND communication evasion combined — the "full stack"
  # adversary, both mechanisms the classifier has now seen individually
  - {name: low_mem_chunked_9, kind: low_mem_disguise, steps: 2000, batch_size: 4, seq_len: 512, chunk_grad_sync: true, kv_chunk_tokens: 2048, nproc: 3}
model:
  backend: tiny
  n_layer: 12
  n_head: 12
  n_embd: 768
  vocab_size: 32000
  block_size: 512
output_dir: outputs/azure_redteam_loop_continued
