# False-positive BOUNDARY sweep (see docs/REDTEAM.md) -- follow-up to
# configs/azure_false_positive_check.yaml + azure_redteam_false_positive_fix.yaml.
#
# What the fix run already showed: folding in 3 heavy-inference points
# (infer_dp bigbatch=32/seq512, infer_dp longctx=batch8/seq2048, infer_tp
# heavy=batch8/seq1024) as negatives, then testing 2 FRESH infer_dp points
# (batch24/seq768 -> mean_p=0.369, batch16/seq1536 -> mean_p=0.295) confirmed
# generalization -- both fixed points landed below the 0.5 threshold. But:
#   (a) those two numbers are close-ish to 0.5, not deeply below it -- worth
#       knowing whether that's a cliff right at those points or a gradual
#       gradient with more room, and
#   (b) infer_tp (tensor-parallel) was folded in as a negative (1 window)
#       but NEVER retested fresh -- the fix's generalization claim so far
#       only actually covers the data-parallel axis.
# This sweep evaluates the ALREADY-FIXED classifier
# (outputs/azure_redteam_fp_fix/classifier_fixed.joblib) against many more
# points spanning: baseline sanity checks, interpolation between baseline
# and the originally-folded-in extremes, exact repeats of the folded-in
# points (regression sanity -- should now read LOW, they're in training
# data), and extrapolation beyond every point tested so far on both the
# dp-batch, dp-seq, and tp axes. Nothing here gets folded into any
# classifier -- pure evaluation, same script as the original check
# (run_false_positive_check.py doesn't mutate its input classifier).
#
# Run (GPUs 3-5):
#   python -m src.run_false_positive_check \
#     --classifier outputs/azure_redteam_fp_fix/classifier_fixed.joblib \
#     --config configs/azure_false_positive_boundary_sweep.yaml \
#     --out outputs/azure_false_positive_boundary_sweep
#
# REVISED 2026-08-22 19:40 UTC after a first attempt (see docs/REDTEAM.md):
# workload names below MUST contain "infer" -- src/redteam/features.py's
# _label_from_name() keys off substrings in the *name* field ("infer" /
# "train" / "diloco" / ...), not the `kind` field, and the first attempt's
# short names ("dp_baseline_sanity" etc.) matched none of them, so every
# window silently got is_training=None and got dropped by to_matrix before
# ever reaching the classifier -- n_windows=0 for all 12 points despite
# ~19 real GPU-minutes of correctly-executing workloads. Recovered the
# actual numbers from that run's raw trace by relabeling in place (data
# itself was fine, only the label string was wrong) -- confirms the fix
# hypothesis but also showed several points had too few feature windows
# (as low as n=1, esp. every tp point) to trust individually. Per-workload
# steps below are re-calibrated from that run's OWN measured per-step
# wall-clock time (varies ~7x across these batch/seq/tp combos) to target
# ~150-180s per dp point and ~120s per tp point -- enough for several
# 30s-window/15s-stride samples at every point, not just 1.
run_name: azure_false_positive_boundary_sweep
mode: redteam
collector:
  host: 127.0.0.1
  port: 8768
telemetry:
  synthetic: false
  hz: 1.0
  gpu_indices: [3, 4, 5]
benign_stress_workloads:
  # --- dp-batch axis (seq=512 fixed), baseline batch=8 ---
  - {name: infer_dp_baseline_sanity, kind: infer_dp, steps: 550, batch_size: 8, seq_len: 512, nproc: 3}
  - {name: infer_dp_b16_s512, kind: infer_dp, steps: 300, batch_size: 16, seq_len: 512, nproc: 3}
  - {name: infer_dp_b24_s512, kind: infer_dp, steps: 210, batch_size: 24, seq_len: 512, nproc: 3}
  - {name: infer_dp_b32_s512_regression, kind: infer_dp, steps: 160, batch_size: 32, seq_len: 512, nproc: 3}
  - {name: infer_dp_b48_s512_extrapolate, kind: infer_dp, steps: 110, batch_size: 48, seq_len: 512, nproc: 3}
  # --- dp-seq axis (batch=8 fixed), baseline seq=512 ---
  - {name: infer_dp_b8_s1024, kind: infer_dp, steps: 280, batch_size: 8, seq_len: 1024, nproc: 3}
  - {name: infer_dp_b8_s2048_regression, kind: infer_dp, steps: 125, batch_size: 8, seq_len: 2048, nproc: 3}
  - {name: infer_dp_b8_s3072_extrapolate, kind: infer_dp, steps: 75, batch_size: 8, seq_len: 3072, nproc: 3}
  # --- tp axis (never freshly tested before), baseline batch=2/seq=512/tp=3 ---
  - {name: infer_tp_baseline_sanity, kind: infer_tp, steps: 2800, batch_size: 2, seq_len: 512, tp_size: 3, nproc: 3}
  - {name: infer_tp_b4_s512, kind: infer_tp, steps: 2000, batch_size: 4, seq_len: 512, tp_size: 3, nproc: 3}
  - {name: infer_tp_b8_s512, kind: infer_tp, steps: 1400, batch_size: 8, seq_len: 512, tp_size: 3, nproc: 3}
  - {name: infer_tp_b8_s1536_fresh, kind: infer_tp, steps: 450, batch_size: 8, seq_len: 1536, tp_size: 3, nproc: 3}
model:
  backend: tiny
  n_layer: 12
  n_head: 12
  n_embd: 768
  vocab_size: 32000
  block_size: 4096
output_dir: outputs/azure_false_positive_boundary_sweep
