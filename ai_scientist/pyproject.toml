[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-scientist"
version = "0.1.0"
description = "Evolutionary AI research harness: MAP-Elites + novelty search over hypotheses and experiment plans"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Long Yi" }]

dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
llm = [
    "openai>=1.35.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
sci = "ai_scientist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_scientist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:ai_scientist.*"]
markers = ["slow: spawns real subprocesses (worker / detached daemon)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
